name: Publish ems-sim (GitHub Pages)

# ems-sim/ の内容を gh-pages ブランチに公開します。
# 初回のみ: リポジトリの Settings → Pages → Source を「Deploy from a branch」/ gh-pages / (root) に設定してください。
on:
  push:
    branches: [claude/laughing-ramanujan-2wiy3j, main]
    paths: ['ems-sim/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ems-sim-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site and push to gh-pages
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/site" && mkdir "$RUNNER_TEMP/site"
          cp -r ems-sim/. "$RUNNER_TEMP/site/"
          rm -f "$RUNNER_TEMP/site/start-mac.command"
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ems-sim from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
