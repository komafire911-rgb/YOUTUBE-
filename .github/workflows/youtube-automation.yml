name: YouTube 動画自動生成パイプライン

on:
  # 定期実行（UTC。毎日9:00 UTC = 日本時間18:00）。必要に応じて調整してください。
  schedule:
    - cron: "0 9 * * *"
  # 手動実行も可能にする
  workflow_dispatch: {}

# topics.yaml のステータス更新をリポジトリに書き戻すための権限
permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: ffmpeg をインストール（動画合成に必要）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: パイプラインを実行
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gtts' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
        run: python main.py

      - name: 生成物をアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: テーマの処理状況（topics.yaml）をコミット
        if: always()
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- config/topics.yaml; then
            git add config/topics.yaml
            git commit -m "chore: topics.yaml のステータスを更新 [skip ci]"
            git push
          else
            echo "topics.yaml に変更なし"
          fi
