topics:
- id: brain-day01
  title: 脳はたった2％の重量で、エネルギーを20％も消費する怪物だった！？
  prompt: 成人脳の平均的な重さ（約1.4kg）と、それが体の約2%しかないのに、消費するエネルギーは全体の約20%という事実を紹介する。
  status: done
- id: brain-day02
  title: 脳のシワが多い人は本当に賢い！？進化が生んだ驚きの真実！
  prompt: 大脳皮質のシワ（溝と隆起）が、表面積を広げ、より多くの神経細胞を詰め込むための進化の知恵であることを解説する。
  status: done
- id: brain-day03
  title: あなたの脳には860億個の星が輝く小さな宇宙がある！？
  prompt: 脳には約860億個の神経細胞（ニューロン）があり、それらが複雑なネットワークを形成していることを紹介する。
  status: done
- id: brain-day04
  title: えっ！？脳は痛みを感じない臓器だった！？
  prompt: 脳自体には痛覚受容体がないため、切られても触られても痛みを感じないことを説明する。手術中に意識のある患者の例にも触れる。
  status: done
- id: brain-day05
  title: え？脳って一生変わり続けるって本当！？
  prompt: 脳が経験や学習によって構造や機能を変える能力（神経可塑性）を持つことを、新しい言語の習得などの例で解説する。
  status: done
- id: brain-day06
  title: 夢はただの妄想じゃない！？実は脳の超重要ミッションだった！
  prompt: 夢が記憶の整理、感情の処理、問題解決など、脳にとって重要な役割を果たしていることを紹介する。
  status: done
- id: brain-day07
  title: 「え、ここ来たことある…？」それ、脳のバグかもしれません。
  prompt: 脳の記憶処理の一時的なエラーや情報処理のわずかなズレがデジャヴ（既視感）の原因とされていることを解説する。
  status: done
- id: brain-day08
  title: えっ！？あなたの怒りも涙も、すべて脳が作っていた！？
  prompt: 感情の生成に関わる脳の部位（扁桃体、前頭前野など）を紹介し、喜怒哀楽が脳の反応であることを解説する。
  status: done
- id: brain-day09
  title: 「また忘れた…」それ、あなたのせいじゃなく脳の仕様です！
  prompt: 短期記憶、長期記憶（エピソード記憶、意味記憶など）といった記憶の分類と、それぞれの特徴を解説する。
  status: done
- id: brain-day10
  title: 「集中できないのは性格じゃない！」その原因、脳内物質にあった！
  prompt: ドーパミンやノルアドレナリンが集中力にどう影響するか、ポモドーロテクニックなどの集中法とあわせて紹介する。
  status: pending
- id: brain-day11
  title: 「そのストレス、脳を壊す前兆かも…」放置は超キケン！
  prompt: 長期的なストレスが脳（特に海馬や扁桃体）に与える悪影響と、マインドフルネスなどストレス軽減に有効なアプローチを提示する。
  status: pending
- id: brain-day12
  title: 「ありがとう」で脳が変わる！？科学が証明した感謝の力とは
  prompt: 感謝の実践が脳の報酬系（ドーパミン回路）を活性化させ、幸福感を高める効果があることを解説する。
  status: pending
- id: brain-day13
  title: なぜ抜け出せない！？「ハマる」は脳の罠だった！
  prompt: ドーパミンを介した脳の報酬系が、ゲームやSNSなどへの「ハマり」にどう関わっているかを解説する。
  status: pending
- id: brain-day14
  title: なぜ懐かしい匂いは、涙が出るほど心を揺さぶるのか？
  prompt: 匂いの情報が脳の記憶や感情を司る部位（海馬、扁桃体）に直接届きやすいため、特定の匂いが強い記憶や感情を呼び起こすことを解説する。
  status: pending
- id: brain-day15
  title: 「やる気が出ないのはあなたのせいじゃない！」脳が怠け者の本当の理由
  prompt: 脳がエネルギー効率を重視するため、できるだけ楽な方法を選びがちであること（認知的負荷の回避）を解説する。
  status: pending
- id: brain-day16
  title: 決断はあなたの意志じゃない！？脳の無意識が握っていた
  prompt: 意思決定に関わる脳の部位（前頭前野、大脳基底核など）と、直感や論理がどう絡み合うかを解説する。
  status: pending
- id: brain-day17
  title: あなたの目はウソをつく！？脳が作り出す驚きの錯覚の秘密
  prompt: ミュラー・リヤー錯視のような目の錯覚を例に、脳が情報を補完・解釈しようとすることで錯覚が生まれることを解説する。
  status: pending
- id: brain-day18
  title: 薬じゃないのに効く？プラシーボ効果は脳の魔法だった！
  prompt: プラシーボ効果が、期待や信念によって脳内で痛み抑制物質などが分泌されること（内因性オピオイドなど）と関連していることを解説する。
  status: pending
- id: brain-day19
  title: ポジティブ思考が脳を変える！？幸せホルモン大量放出の秘密
  prompt: ポジティブな思考が脳の報酬系やストレス反応に良い影響を与え、幸福感を高めるメカニズムを解説する。
  status: pending
- id: brain-day20
  title: 音楽は脳の恋人！？驚きの癒しと集中力アップ効果
  prompt: 音楽が脳の様々な領域（報酬系、運動野、聴覚野など）を活性化させ、感情、記憶、集中力に影響を与えることを解説する。
  status: pending
- id: brain-day21
  title: あの顔、忘れられない理由は脳の秘密だった！
  prompt: 脳の中に顔の認識に特化した領域（紡錘状回など）があること、社会性や生存に重要な役割を果たすことを解説する。
  status: pending
- id: brain-day22
  title: 脳が歓喜！科学的に証明された最強の学習法とは？
  prompt: 脳科学に基づいた効果的な学習法（分散学習、アクティブリコールなど）を紹介する。
  status: pending
- id: brain-day23
  title: 三日坊主はもう終わり！習慣は脳を変える最強メソッド
  prompt: 習慣形成が脳の神経回路を強化し、自動化されるメカニズム（大脳基底核の役割）を解説する。
  status: pending
- id: brain-day24
  title: バイリンガルは脳のスーパーヒーローだった！？
  prompt: 新しい言語を学ぶことが脳にどのような影響を与え、認知機能の向上に繋がるかを解説する。
