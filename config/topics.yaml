  title: 瞑想で脳が進化！？驚きのストレス激減＆集中力爆上げ効果
  prompt: 瞑想が脳構造（灰白質の増加など）や機能にポジティブな変化をもたらし、ストレス軽減や集中力向上に繋がることを解説する。
